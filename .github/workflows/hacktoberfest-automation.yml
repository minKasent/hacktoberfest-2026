name: Hacktoberfest 2026 Cloud Automation

on:
  schedule:
    # Runs at 00:15 UTC on October 1st (7:15 AM Vietnam Time)
    - cron: '15 0 1 10 *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run immediately regardless of date (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  qualify-hacktoberfest:
    name: Generate & Merge 6 Qualifying Architectural PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Hacktoberfest Automation Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: |
          chmod +x ./scripts/run-hacktoberfest.sh
          ./scripts/run-hacktoberfest.sh
