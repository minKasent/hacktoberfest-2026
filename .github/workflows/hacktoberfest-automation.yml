name: Hacktoberfest 2026 Cloud Automation

on:
  schedule:
    # 00:15 UTC on October 1st (7:15 AM Vietnam Time)
    - cron: '15 0 1 10 *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run immediately regardless of date'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  qualify-hacktoberfest:
    name: Generate & Merge 6 Qualifying Architectural PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git Identity & GitHub CLI
        run: |
          git config --global user.name "dangkhoa"
          git config --global user.email "dangkhoa3971@gmail.com"
          echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Verify Date & Repository Topic
        run: |
          MONTH=$(date -u +%m)
          DAY=$(date -u +%d)
          FORCE="${{ github.event.inputs.force_run }}"

          echo "Current UTC Date: Month=$MONTH, Day=$DAY, Force=$FORCE"

          if [ "$FORCE" != "true" ] && [ "$MONTH" != "10" ]; then
            echo "::warning::Not October yet. Hacktoberfest starts October 1st. Pass force_run=true to test."
            exit 0
          fi

          # Verify hacktoberfest topic
          TOPICS=$(gh repo view --json repositoryTopics -q '.repositoryTopics[].name')
          echo "Repository topics: $TOPICS"

      - name: Execute 6 High-Quality Pull Requests
        run: |
          mkdir -p src/algorithms src/security src/patterns src/concurrency src/structures

          # Array of 6 architectural modules: Slug | FilePath | Title | Description
          MODULES=(
            "lru-cache|src/algorithms/lru_cache.ts|feat(algorithms): implement O(1) LRU Cache with doubly-linked list|High-performance Least Recently Used (LRU) Cache combining a hash map with a doubly linked list for constant time O(1) access and eviction."
            "dijkstra-graph|src/algorithms/dijkstra.ts|feat(algorithms): implement Dijkstra shortest path with min-heap|Optimized Dijkstra single-source shortest path algorithm using an indexed binary min-heap for O((V + E) log V) complexity."
            "token-bucket|src/security/rate_limiter.ts|feat(security): implement distributed Token Bucket rate limiter|Resilient token bucket traffic shaper with burst capacity handling and fractional token refill mechanics."
            "circuit-breaker|src/patterns/circuit_breaker.ts|feat(patterns): implement finite state machine Circuit Breaker|Fault-tolerant Circuit Breaker with Closed, Open, and Half-Open states to prevent cascading downstream failures."
            "worker-queue|src/concurrency/async_queue.ts|feat(concurrency): implement priority-bounded Async Worker Queue|Concurrency-controlled task executor with bounded pool workers, error isolation, and graceful shutdown."
            "bloom-filter|src/structures/bloom_filter.ts|feat(structures): implement space-efficient Bloom Filter|Probabilistic space-efficient membership test with double-hashing technique and configurable false positive rate."
          )

          PR_RESULTS=()

          for i in "${!MODULES[@]}"; do
            INDEX=$((i + 1))
            IFS="|" read -r SLUG FILE_PATH TITLE DESC <<< "${MODULES[$i]}"

            echo "=================================================="
            echo "Processing [$INDEX/6]: $TITLE"
            echo "=================================================="

            # Check if file already committed to main
            if [ -f "$FILE_PATH" ]; then
              echo "File $FILE_PATH already exists, appending incremental test fixture..."
              ACTION_TYPE="update"
            else
              ACTION_TYPE="create"
            fi

            BRANCH="hacktoberfest-feat-$SLUG"
            git checkout -B "$BRANCH" origin/main

            # Generate real production TypeScript implementation
            case "$SLUG" in
              "lru-cache")
                cat << 'EOF' > "$FILE_PATH"
/**
 * @file lru_cache.ts
 * @description Least Recently Used (LRU) Cache with O(1) runtime complexity.
 */

class DNode<K, V> {
  constructor(
    public key: K,
    public value: V,
    public prev: DNode<K, V> | null = null,
    public next: DNode<K, V> | null = null
  ) {}
}

export class LRUCache<K, V> {
  private readonly capacity: number;
  private readonly map = new Map<K, DNode<K, V>>();
  private readonly head = new DNode<K, V>(null as any, null as any);
  private readonly tail = new DNode<K, V>(null as any, null as any);

  constructor(capacity: number) {
    if (capacity <= 0) throw new Error("Capacity must be positive");
    this.capacity = capacity;
    this.head.next = this.tail;
    this.tail.prev = this.head;
  }

  public get(key: K): V | undefined {
    const node = this.map.get(key);
    if (!node) return undefined;
    this.moveToHead(node);
    return node.value;
  }

  public put(key: K, value: V): void {
    const existing = this.map.get(key);
    if (existing) {
      existing.value = value;
      this.moveToHead(existing);
      return;
    }

    if (this.map.size >= this.capacity) {
      const evicted = this.removeTail();
      if (evicted) this.map.delete(evicted.key);
    }

    const newNode = new DNode(key, value);
    this.map.set(key, newNode);
    this.addToHead(newNode);
  }

  public size(): number {
    return this.map.size;
  }

  private addToHead(node: DNode<K, V>): void {
    node.prev = this.head;
    node.next = this.head.next;
    if (this.head.next) this.head.next.prev = node;
    this.head.next = node;
  }

  private removeNode(node: DNode<K, V>): void {
    if (node.prev) node.prev.next = node.next;
    if (node.next) node.next.prev = node.prev;
  }

  private moveToHead(node: DNode<K, V>): void {
    this.removeNode(node);
    this.addToHead(node);
  }

  private removeTail(): DNode<K, V> | null {
    const last = this.tail.prev;
    if (!last || last === this.head) return null;
    this.removeNode(last);
    return last;
  }
}
EOF
